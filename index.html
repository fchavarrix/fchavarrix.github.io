<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demos · Atlas Kinetix</title>
    <meta name="description" content="Demos de Atlas Kinetix para probar desde el celular." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap" />
    <style>
      :root { --tinta: #07294e; --texto: #3c4f63; --fondo: #ffffff; --linea: #dde5ee; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--fondo); color: var(--tinta); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
      .marca { font-family: Sora, sans-serif; font-size: 20px; margin: 0 0 32px; }
      .marca b { font-weight: 700; }
      h1 { font-family: Sora, sans-serif; font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
      p { color: var(--texto); margin: 0 0 24px; }
      a.demo { display: block; border: 1px solid var(--linea); border-radius: 12px; padding: 20px; color: inherit; text-decoration: none; }
      a.demo:hover, a.demo:focus-visible { border-color: var(--tinta); }
      a.demo strong { font-family: Sora, sans-serif; font-size: 18px; display: block; margin-bottom: 4px; }
      a.demo span { color: var(--texto); }
      footer { margin-top: 48px; font-size: 14px; color: var(--texto); }
      footer a { color: var(--tinta); }
    </style>
  </head>
  <body>
    <main>
      <p class="marca"><b>Atlas</b> Kinetix</p>
      <h1>Demos</h1>
      <p>Prototipos para probar desde el celular.</p>
      <a class="demo" href="/encuentra-tu-auto/">
        <strong>Encuentra tu auto</strong>
        <span>Marca dónde estacionaste y un punto azul te lleva de vuelta, cambiando de piso y de edificio.</span>
      </a>
      <footer>Atlas Kinetix LAC · <a href="https://www.atlas-lac.com">www.atlas-lac.com</a></footer>
    </main>
  </body>
</html>
